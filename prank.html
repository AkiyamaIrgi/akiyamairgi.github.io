<!DOCTYPE html>
<html>
<head>
<title>Prank</title>

<style>
body{
    background: linear-gradient(
        135deg,
        #ff9a9e,
        #fad0c4,
        #ffd1ff
    );

    height:100vh;
    overflow:hidden;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    font-family:Arial;
}

h1{
    color:white;
    font-size:50px;
    text-shadow:2px 2px 10px rgba(0,0,0,0.3);
}

button{
    padding:15px 30px;
    font-size:20px;
    border:none;
    border-radius:15px;
    cursor:pointer;
}

#iya{
    margin-right:20px;
}

#tidak{
    position:absolute;
    left:55%;
    top:55%;
}
</style>

</head>
<body>

<h1>Mau jadi pacarku? ❤️</h1>

<div>
    <button id="iya">Iya</button>
    <button id="tidak">Tidak</button>
</div>

<script>
const tidak = document.getElementById("tidak");

tidak.addEventListener("mouseover", ()=>{

    const x = Math.random() * (window.innerWidth - 120);
    const y = Math.random() * (window.innerHeight - 60);

    tidak.style.left = x + "px";
    tidak.style.top = y + "px";
});

document.getElementById("iya").onclick = ()=>{
    alert("YEAYYY ❤️🎉");
};
</script>

</body>
</html>
