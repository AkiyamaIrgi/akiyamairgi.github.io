<!DOCTYPE html>
<html>
<head>
<style>
body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #ffd1e8, #fff0f7);
  font-family: Arial, sans-serif;
}

.container {
  text-align: center;
}

h1 {
  color: #ff4081;
  font-size: 35px;
}

p {
  font-size: 20px;
}

button {
  position: absolute;
  padding: 15px 30px;
  border: none;
  border-radius: 30px;
  font-size: 18px;
  color: white;
  cursor: pointer;
  transition: 0.2s;
}

#yes {
  background: #ff4081;
  left: 40%;
  top: 60%;
}

#no {
  background: #888;
  left: 55%;
  top: 60%;
}

.heart {
  position: absolute;
  font-size: 25px;
  animation: naik 3s infinite;
}

@keyframes naik {
  0% {
    transform: translateY(100vh);
    opacity: 1;
  }
  100% {
    transform: translateY(-10vh);
    opacity: 0;
  }
}
</style>
</head>

<body>

<div class="container">
  <h1>Hai kamu 😳</h1>
  <p>Mau jadi orang spesial aku? 💗</p>
</div>

<button id="yes">Mau 😍</button>
<button id="no">Tidak 😏</button>


<script>
const no = document.getElementById("no");
const yes = document.getElementById("yes");

function kabur() {
  let x = Math.random() * (window.innerWidth - no.offsetWidth);
  let y = Math.random() * (window.innerHeight - no.offsetHeight);

  no.style.left = x + "px";
  no.style.top = y + "px";
}

no.addEventListener("mouseover", kabur);
no.addEventListener("touchstart", kabur);


yes.addEventListener("click", () => {
  alert("Yeay 😆💗 Makasih udah jawab!");
});


// bikin hati muncul
setInterval(() => {
  let heart = document.createElement("div");
  heart.className = "heart";
  heart.innerHTML = "❤️";

  heart.style.left = Math.random() * 100 + "vw";

  document.body.appendChild(heart);

  setTimeout(() => {
    heart.remove();
  }, 3000);

}, 500);

</script>

</body>
</html>
